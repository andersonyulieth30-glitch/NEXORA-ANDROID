name: Crear APK firmado de NEXORA

on:
  workflow_dispatch:
  push:
    branches:
      - principal
      - main
      - master

jobs:
  construir:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable

      - name: Crear estructura Android
        run: flutter create . --platforms=android --project-name nexora

      - name: Actualizar versiones de Gradle
        run: |
          python3 - <<'PY'
          from pathlib import Path
          settings = Path('android/settings.gradle')
          wrapper = Path('android/gradle/wrapper/gradle-wrapper.properties')
          text = settings.read_text()
          text = text.replace('com.android.application" version "7.3.0', 'com.android.application" version "8.1.0')
          text = text.replace('org.jetbrains.kotlin.android" version "1.7.10', 'org.jetbrains.kotlin.android" version "1.8.22')
          settings.write_text(text)
          text = wrapper.read_text().replace('gradle-7.6.3-all.zip', 'gradle-8.0.2-all.zip')
          wrapper.write_text(text)
          PY

      - name: Configurar Firebase Android
        run: |
          cp google-services.json android/app/google-services.json
          python3 - <<'PY'
          from pathlib import Path
          import re
          settings = Path('android/settings.gradle')
          app = Path('android/app/build.gradle')
          text = settings.read_text()
          if 'com.google.gms.google-services' not in text:
              text = re.sub(r'(plugins\s*\{)', r'\1\n    id "com.google.gms.google-services" version "4.4.2" apply false', text, count=1)
              settings.write_text(text)
          text = app.read_text()
          if 'id "com.google.gms.google-services"' not in text:
              text = re.sub(r'(plugins\s*\{)', r'\1\n    id "com.google.gms.google-services"', text, count=1)
          text = text.replace('minSdk = flutter.minSdkVersion', 'minSdk = 23')
          text = text.replace('minSdkVersion flutter.minSdkVersion', 'minSdkVersion 23')
          app.write_text(text)
          PY

      - name: Preparar firma permanente
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          test -n "$KEYSTORE_BASE64" || { echo 'Falta KEYSTORE_BASE64'; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo 'Falta KEYSTORE_PASSWORD'; exit 1; }
          test -n "$KEY_ALIAS" || { echo 'Falta KEY_ALIAS'; exit 1; }
          test -n "$KEY_PASSWORD" || { echo 'Falta KEY_PASSWORD'; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/nexora-upload-key.jks
          test -s android/app/nexora-upload-key.jks || { echo 'El archivo de firma esta vacio'; exit 1; }
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=nexora-upload-key.jks\n' "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties
          python3 - <<'PY'
          from pathlib import Path
          import re
          app = Path('android/app/build.gradle')
          text = app.read_text()
          props = [
              'def keystoreProperties = new Properties()',
              "def keystorePropertiesFile = rootProject.file('key.properties')",
              'if (!keystorePropertiesFile.exists()) {',
              "    throw new GradleException('No se encontro android/key.properties')",
              '}',
              'keystoreProperties.load(new FileInputStream(keystorePropertiesFile))',
          ]
          if 'def keystoreProperties = new Properties()' not in text:
              plugin = re.search(r'(?m)^plugins\s*\{[^}]*\}', text, re.S)
              if not plugin:
                  raise SystemExit('No se encontro el bloque plugins de Gradle')
              text = text[:plugin.end()] + '\n\n' + '\n'.join(props) + '\n' + text[plugin.end():]
          signing = [
              '    signingConfigs {',
              '        release {',
              "            keyAlias keystoreProperties['keyAlias']",
              "            keyPassword keystoreProperties['keyPassword']",
              "            storeFile file(keystoreProperties['storeFile'])",
              "            storePassword keystoreProperties['storePassword']",
              '        }',
              '    }',
          ]
          if 'signingConfigs {' not in text:
              android = re.search(r'(?m)^android\s*\{', text)
              if not android:
                  raise SystemExit('No se encontro el bloque android de Gradle')
              text = text[:android.end()] + '\n' + '\n'.join(signing) + '\n' + text[android.end():]
          build_types = re.search(r'(?m)^\s*buildTypes\s*\{', text)
          if not build_types:
              raise SystemExit('No se encontro buildTypes en Gradle')
          release = re.search(r'(?m)^\s*release\s*\{', text[build_types.end():])
          if not release:
              raise SystemExit('No se encontro buildTypes.release en Gradle')
          start = build_types.end() + release.end()
          close = text.find('\n        }', start)
          if close < 0:
              raise SystemExit('No se encontro el cierre de buildTypes.release')
          section = text[start:close]
          section = re.sub(r'(?m)^\s*signingConfig\s+signingConfigs\.(debug|release)\s*$', '', section)
          section = '\n            signingConfig signingConfigs.release' + section
          text = text[:start] + section + text[close:]
          app.write_text(text)
          print('Configuracion de firma permanente aplicada.')
          PY

      - name: Verificar huella de la llave permanente
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -e
          HUELLA="$(keytool -list -v -keystore android/app/nexora-upload-key.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" | awk -F': ' '/SHA1:/{print $2; exit}' | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          ESPERADA='D1C3317F1056EE2217CF005F2036130CB494C25E'
          if [ "$HUELLA" != "$ESPERADA" ]; then
            echo 'ERROR: La llave configurada no coincide con la llave permanente recuperada.'
            exit 1
          fi
          echo 'Correcto: la llave permanente recuperada coincide.'

      - name: Instalar dependencias
        run: flutter pub get

      - name: Construir APK firmado
        run: flutter build apk --release

      - name: Verificar firma de la APK generada
        run: |
          set -e
          APK='build/app/outputs/flutter-apk/app-release.apk'
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER" || { echo 'No se encontro apksigner'; exit 1; }
          "$APKSIGNER" verify --print-certs "$APK" > /tmp/nexora-apk-cert.txt
          HUELLA="$(awk -F': ' '/certificate SHA-1 digest:/{print $2; exit}' /tmp/nexora-apk-cert.txt | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          ESPERADA='D1C3317F1056EE2217CF005F2036130CB494C25E'
          if [ "$HUELLA" != "$ESPERADA" ]; then
            echo 'ERROR: La APK no quedo firmada con la llave permanente esperada.'
            exit 1
          fi
          echo 'Correcto: la APK quedo firmada con la llave permanente esperada.'

      - name: Guardar APK firmado
        uses: actions/upload-artifact@v4
        with:
          name: NEXORA-APK-FIRMADO
          path: build/app/outputs/flutter-apk/app-release.apk
