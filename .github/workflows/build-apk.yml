name: Crear APK firmado de NEXORA

on:
  workflow_dispatch:
  push:
    branches:
      - principal
      - main
      - master

jobs:
  construir:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable

      - name: Crear estructura Android
        run: flutter create . --platforms=android --project-name nexora

      - name: Actualizar versiones de Gradle
        run: |
          python3 - <<'PY'
          from pathlib import Path
          settings = Path('android/settings.gradle')
          wrapper = Path('android/gradle/wrapper/gradle-wrapper.properties')
          text = settings.read_text()
          text = text.replace('com.android.application" version "7.3.0', 'com.android.application" version "8.1.0')
          text = text.replace('org.jetbrains.kotlin.android" version "1.7.10', 'org.jetbrains.kotlin.android" version "1.8.22')
          settings.write_text(text)
          text = wrapper.read_text().replace('gradle-7.6.3-all.zip', 'gradle-8.0.2-all.zip')
          wrapper.write_text(text)
          PY

      - name: Configurar Firebase Android
        run: |
          cp google-services.json android/app/google-services.json
          python3 - <<'PY'
          from pathlib import Path
          import re
          settings = Path('android/settings.gradle')
          app = Path('android/app/build.gradle')
          text = settings.read_text()
          if 'com.google.gms.google-services' not in text:
              text = re.sub(r'(plugins\s*\{)', r'\1\n    id "com.google.gms.google-services" version "4.4.2" apply false', text, count=1)
              settings.write_text(text)
          text = app.read_text()
          if 'id "com.google.gms.google-services"' not in text:
              text = re.sub(r'(plugins\s*\{)', r'\1\n    id "com.google.gms.google-services"', text, count=1)
          text = text.replace('minSdk = flutter.minSdkVersion', 'minSdk = 23')
          text = text.replace('minSdkVersion flutter.minSdkVersion', 'minSdkVersion 23')
          app.write_text(text)
          PY

      - name: Preparar firma permanente
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          test -n "$KEYSTORE_BASE64" || { echo 'Falta KEYSTORE_BASE64'; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo 'Falta KEYSTORE_PASSWORD'; exit 1; }
          test -n "$KEY_ALIAS" || { echo 'Falta KEY_ALIAS'; exit 1; }
          test -n "$KEY_PASSWORD" || { echo 'Falta KEY_PASSWORD'; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/nexora-upload-key.jks
          test -s android/app/nexora-upload-key.jks || { echo 'El archivo de firma esta vacio'; exit 1; }
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=nexora-upload-key.jks\n' "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties
          python3 - <<'PY'
          from pathlib import Path
          import re

          app = Path('android/app/build.gradle')
          text = app.read_text()

          def block_bounds(source, pattern, description):
              match = re.search(pattern, source, re.M)
              if not match:
                  raise SystemExit(f'No se encontro el bloque {description}')
              opening = source.find('{', match.start(), match.end() + 1)
              if opening < 0:
                  raise SystemExit(f'No se encontro la llave de apertura de {description}')
              depth = 0
              quote = None
              escaped = False
              for i in range(opening, len(source)):
                  ch = source[i]
                  if quote:
                      if escaped:
                          escaped = False
                      elif ch == '\\':
                          escaped = True
                      elif ch == quote:
                          quote = None
                      continue
                  if ch in ("'", '"'):
                      quote = ch
                  elif ch == '{':
                      depth += 1
                  elif ch == '}':
                      depth -= 1
                      if depth == 0:
                          return match.start(), opening, i + 1
              raise SystemExit(f'Bloque {description} sin cierre')

          props = """def keystoreProperties = new Properties()
          def keystorePropertiesFile = rootProject.file('key.properties')
          if (!keystorePropertiesFile.exists()) {
              throw new GradleException('No se encontro android/key.properties')
          }
          keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          """
          # Asegurar que las propiedades se carguen una sola vez, antes de android.
          text = re.sub(
              r'(?s)def keystoreProperties = new Properties\(\).*?keystoreProperties\.load\(new FileInputStream\(keystorePropertiesFile\)\)\s*',
              '',
              text
          )
          android_match = re.search(r'(?m)^android\s*\{', text)
          if not android_match:
              raise SystemExit('No se encontro el bloque android')
          text = text[:android_match.start()] + props + '\n' + text[android_match.start():]

          # Reemplazar por completo signingConfigs para evitar que Gradle use debug.
          try:
              start, opening, end = block_bounds(text, r'(?m)^\s*signingConfigs\s*\{', 'signingConfigs')
              signing_block = """signingConfigs {
                  release {
                      keyAlias keystoreProperties['keyAlias']
                      keyPassword keystoreProperties['keyPassword']
                      storeFile file(keystoreProperties['storeFile'])
                      storePassword keystoreProperties['storePassword']
                  }
              }"""
              text = text[:start] + signing_block + text[end:]
          except SystemExit as exc:
              if 'No se encontro el bloque signingConfigs' not in str(exc):
                  raise
              _, android_open, _ = block_bounds(text, r'(?m)^android\s*\{', 'android')
              text = text[:android_open + 1] + """
              signingConfigs {
                  release {
                      keyAlias keystoreProperties['keyAlias']
                      keyPassword keystoreProperties['keyPassword']
                      storeFile file(keystoreProperties['storeFile'])
                      storePassword keystoreProperties['storePassword']
                  }
              }
              """ + text[android_open + 1:]

          # Forzar release a usar la firma permanente, sin tocar debug.
          bt_start, bt_open, bt_end = block_bounds(text, r'(?m)^\s*buildTypes\s*\{', 'buildTypes')
          bt_text = text[bt_open + 1:bt_end - 1]
          rel = re.search(r'(?m)^\s*release\s*\{', bt_text)
          if not rel:
              raise SystemExit('No se encontro buildTypes.release')
          rel_open = bt_open + 1 + bt_text.find('{', rel.start(), rel.end() + 1)
          depth = 0
          rel_end = None
          for i in range(rel_open, bt_end):
              if text[i] == '{':
                  depth += 1
              elif text[i] == '}':
                  depth -= 1
                  if depth == 0:
                      rel_end = i + 1
                      break
          if rel_end is None:
              raise SystemExit('El bloque release no tiene cierre')
          release_body = text[rel_open + 1:rel_end - 1]
          release_body = re.sub(r'(?m)^\\s*signingConfig\\s+signingConfigs\\.[A-Za-z0-9_]+\\s*;?\\s*$', '', release_body)
          release_body = '\\n            signingConfig signingConfigs.release\\n' + release_body
          text = text[:rel_open + 1] + release_body + text[rel_end - 1:]

          app.write_text(text)
          print('Firma release configurada explicitamente con la llave permanente.')
          print('Se verificara que el APK use exactamente el mismo certificado.')
          PY

      - name: Obtener huella de la llave permanente
        id: huella_llave
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -e
          HUELLA="$(keytool -list -v -keystore android/app/nexora-upload-key.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" | awk -F': ' '/SHA1:/{print $2; exit}' | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          test -n "$HUELLA" || { echo 'No se pudo leer la huella SHA-1 de la llave'; exit 1; }
          echo "Huella SHA-1 de la llave configurada: $HUELLA"
          echo "sha1=$HUELLA" >> "$GITHUB_OUTPUT"

      - name: Instalar dependencias
        run: flutter pub get

      - name: Construir APK firmado
        run: flutter build apk --release

      - name: Verificar que la APK use esa misma llave
        env:
          HUELLA_LLAVE: ${{ steps.huella_llave.outputs.sha1 }}
        run: |
          set -e
          APK='build/app/outputs/flutter-apk/app-release.apk'
          test -s "$APK" || { echo 'No se encontro la APK generada'; exit 1; }
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER" || { echo 'No se encontro apksigner'; exit 1; }
          "$APKSIGNER" verify --print-certs "$APK" > /tmp/nexora-apk-cert.txt
          HUELLA_APK="$(grep -i 'SHA-1' /tmp/nexora-apk-cert.txt | grep -oE '[0-9A-Fa-f]{40}' | head -n 1 | tr '[:lower:]' '[:upper:]')"
          if [ -z "$HUELLA_APK" ]; then
            echo 'No se pudo extraer la huella SHA-1 del certificado de la APK.'
            cat /tmp/nexora-apk-cert.txt
            exit 1
          fi
          echo "Huella SHA-1 de la APK: $HUELLA_APK"
          echo "Huella SHA-1 esperada: $HUELLA_LLAVE"
          if [ "$HUELLA_APK" != "$HUELLA_LLAVE" ]; then
            echo 'ERROR: La APK no esta firmada con la llave permanente configurada.'
            exit 1
          fi
          echo 'Correcto: la APK esta firmada con la llave permanente configurada.'

      - name: Guardar APK firmado
        uses: actions/upload-artifact@v4
        with:
          name: NEXORA-APK-FIRMADO
          path: build/app/outputs/flutter-apk/app-release.apk
