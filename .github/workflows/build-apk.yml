name: Crear APK de NEXORA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable

      - name: Crear estructura Android
        run: flutter create . --platforms=android --project-name nexora

      - name: Actualizar versiones de Gradle
        run: |
          python3 - <<'PY'
          from pathlib import Path

          settings = Path("android/settings.gradle")
          wrapper = Path("android/gradle/wrapper/gradle-wrapper.properties")

          content = settings.read_text()
          content = content.replace(
              'id "com.android.application" version "7.3.0"',
              'id "com.android.application" version "8.1.0"'
          )
          content = content.replace(
              'id "org.jetbrains.kotlin.android" version "1.7.10"',
              'id "org.jetbrains.kotlin.android" version "1.8.22"'
          )
          settings.write_text(content)

          content = wrapper.read_text()
          content = content.replace(
              "gradle-7.6.3-all.zip",
              "gradle-8.0.2-all.zip"
          )
          wrapper.write_text(content)

          print("Versiones de Android Gradle Plugin, Kotlin y Gradle actualizadas.")
          print(settings.read_text())
          print(wrapper.read_text())
          PY

      - name: Configurar Firebase Android
        run: |
          cp google-services.json android/app/google-services.json

          python3 - <<'PY'
          from pathlib import Path
          import re

          settings = Path("android/settings.gradle")
          app = Path("android/app/build.gradle")

          def add_plugin(path, plugin_line):
              content = path.read_text()
              if plugin_line not in content:
                  start = content.find("plugins {")
                  if start == -1:
                      raise SystemExit(f"No se encontro plugins en {path}")
                  end = content.find("\n}", start)
                  if end == -1:
                      raise SystemExit(f"No se encontro cierre de plugins en {path}")
                  content = content[:end] + "\n    " + plugin_line + content[end:]
                  path.write_text(content)

          add_plugin(
              settings,
              'id "com.google.gms.google-services" version "4.4.2" apply false'
          )

          add_plugin(
              app,
              'id "com.google.gms.google-services"'
          )

          content = app.read_text()
          content = re.sub(
              r'minSdkVersion\s*=\s*flutter\.minSdkVersion',
              'minSdkVersion = 23',
              content
          )
          content = re.sub(
              r'minSdkVersion\s+flutter\.minSdkVersion',
              'minSdkVersion 23',
              content
          )
          content = re.sub(
              r'minSdk\s*=\s*flutter\.minSdkVersion',
              'minSdk = 23',
              content
          )
          app.write_text(content)

          print("Configuracion de Firebase y Android aplicada.")
          print("Configuracion minSdk:")
          for line in content.splitlines():
              if "minSdk" in line:
                  print(line)
          PY

      - name: Instalar dependencias
        run: flutter pub get

      - name: Construir APK
        run: flutter build apk --release

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXORA-APK
          path: build/app/outputs/flutter-apk/app-release.apk
